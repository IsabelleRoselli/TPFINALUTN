<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - CATTLEYA</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .admin-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.12); margin-bottom: 18px; }
    .admin-title { color: #8b2e2e; margin-bottom: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input, textarea, select { width:100%; padding:12px 14px; border:1px solid #e0e0e0; border-radius:8px; font-family: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    .admin-actions { display:flex; gap:10px; flex-wrap: wrap; align-items:center; margin-top: 12px; }
    .btn-admin { padding: 10px 14px; border: none; border-radius: 8px; cursor:pointer; font-weight: 700; }
    .btn-save { background: #5a070b; color: white; }
    .btn-save:hover { background: #3d050a; }
    .btn-ghost { background: #f5f1f0; color: #5a070b; border: 1px solid #e3d8d6; }
    .btn-danger { background: #8b2e2e; color: white; }
    .btn-danger:hover { background: #6b1e1e; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #eee; text-align:left; }
    th { color: #5a070b; }
    .muted { color: #6d6d6d; font-size: .9rem; }
    .topbar { display:flex; justify-content: space-between; align-items:center; gap: 10px; }
    .hidden { display:none !important; }
    @media (max-width: 800px) { .row, .row-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-card topbar">
      <div>
        <h2 class="admin-title">Panel de Administración</h2>
        <div class="muted">Backend: <span id="apiUrlText"></span></div>
      </div>
      <div class="admin-actions">
        <a class="btn btn-secondary" href="index.html">Volver al sitio</a>
        <button class="btn-admin btn-ghost" id="logoutBtn">Cerrar sesión</button>
      </div>
    </div>

    <div class="admin-card" id="loginCard">
      <h3 class="admin-title">Login</h3>
      <div class="row">
        <div>
          <label>Email</label>
          <input id="loginEmail" type="email" placeholder="admin@admin.com">
        </div>
        <div>
          <label>Contraseña</label>
          <input id="loginPassword" type="password" placeholder="admin123">
        </div>
      </div>
      <div class="admin-actions">
        <button class="btn-admin btn-save" id="loginBtn">Entrar</button>
        <span class="muted" id="loginMsg"></span>
      </div>
    </div>

    <div class="admin-card hidden" id="crudCard">
      <h3 class="admin-title">Crear / Editar producto</h3>
      <input type="hidden" id="productId">

      <div class="row">
        <div>
          <label>Nombre</label>
          <input id="name" placeholder="Ramo Clásico">
        </div>
        <div>
          <label>SKU (único)</label>
          <input id="sku" placeholder="RAM-CLA-001">
        </div>
      </div>

      <div class="row-3" style="margin-top:12px">
        <div>
          <label>Precio (pesos)</label>
          <input id="price" type="number" min="0" step="1" placeholder="4500">
        </div>
        <div>
          <label>Stock</label>
          <input id="stock" type="number" min="0" step="1" value="0">
        </div>
        <div>
          <label>Estado</label>
          <select id="status">
            <option value="active">Activo</option>
            <option value="inactive">Inactivo</option>
            <option value="archived">Archivado</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:12px">
        <div>
          <label>Categoría</label>
<select id="category" required>
  <option value="">Elegí una categoría</option>
  <!-- Las opciones las pone el JS -->
</select>
        </div>
        <div>
          <label>URL Imagen</label>
          <input id="imageUrl" placeholder="https://...">
          <label for="imageFile">Subir imagen</label>
<input id="imageFile" type="file" accept="image/*" />

<button type="button" class="btn-admin btn-ghost" id="uploadBtn">
  Subir
</button>

<small id="uploadMsg"></small>
        </div>
      </div>

      <div style="margin-top:12px">
        <label>Descripción</label>
        <textarea id="description" placeholder="Descripción..."></textarea>
      </div>

      <div class="admin-actions">
        <button class="btn-admin btn-save" id="saveBtn">Guardar</button>
        <button class="btn-admin btn-ghost" id="resetBtn">Limpiar</button>
        <span class="muted" id="formMsg"></span>
      </div>
    </div>

    <div class="admin-card hidden" id="listCard">
      <div class="topbar" style="margin-bottom:12px">
        <h3 class="admin-title">Productos</h3>
        <div class="admin-actions">
          <input id="search" placeholder="Buscar por nombre o SKU">
          <button class="btn-admin btn-ghost" id="refreshBtn">Refrescar</button>
        </div>
      </div>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>SKU</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Estado</th>
              <th class="muted">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="muted" id="listMsg" style="margin-top:10px"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
